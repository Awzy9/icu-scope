<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICU Scope — Latest Critical Care Literature</title>
  <meta name="description" content="Daily-updated feed of recent ICU and critical care research, organized by organ system." />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("icu-scope-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-text">
        <div class="brand">
          <span class="brand-mark">ICU</span>
          <span class="brand-name">Scope</span>
        </div>
        <p class="tagline">Recent critical care literature, organized by system</p>
        <p class="updated-line" id="updated-line">Loading update time…</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark theme">🌙</button>
    </div>
  </header>

  <nav class="category-nav" id="category-nav" aria-label="Categories">
    <!-- populated by app.js -->
  </nav>

  <main class="content">
    <section class="trending-section" id="trending-section" hidden>
      <div class="trending-heading">
        <h2>🔥 Trending this month</h2>
        <span class="category-count" id="trending-count"></span>
      </div>
      <div id="trending-list"></div>
    </section>
    <div id="content">
      <p class="loading">Loading latest articles…</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>
      Sourced from <a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" rel="noopener">PubMed</a> via NCBI E-utilities.
      Updated automatically. This site aggregates publicly available citations and does not host full-text articles.
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
