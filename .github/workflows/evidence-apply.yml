name: Apply editorial decisions

# Decisions recorded via admin.html (/api/review) or `scripts/evidence_cli.py decide` are committed as
# data/decisions/*.json. This workflow re-validates every one against the safety rules (a decision that
# would publish retracted / unverified / failed content is REJECTED and audited), updates the ledger,
# then refreshes the public feed.

on:
  push:
    branches: [main]
    paths:
      - "data/decisions/*.json"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: icu-literature-refresh   # same group as update.yml: never write the ledger concurrently
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run safety tests
        run: python -m unittest discover -s tests -t .
      - name: Apply decisions
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python scripts/evidence_cli.py apply-decisions
      - name: Verify audit chain
        run: python scripts/evidence_cli.py audit-verify
      - name: Commit ledger + audit log
        id: commit
        run: |
          git config user.name "Awzy9"
          git config user.email "291288073+Awzy9@users.noreply.github.com"
          git add -A data/verification.json data/audit_log.jsonl data/decisions data/archive.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else
            git commit -m "Apply editorial decisions"
            git push origin "HEAD:main"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh public feed so decisions take effect
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml
