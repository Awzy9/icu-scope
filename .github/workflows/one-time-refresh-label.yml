name: One-time refresh status label

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-refresh-label.yml"

permissions:
  contents: write

jobs:
  update-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make refresh status explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("app.js")
          text = p.read_text(encoding="utf-8")
          old = 'return `Literature updated ${formatted} · ${health}${windowText}`;'
          new = 'return `Last literature refresh: ${formatted} · ${health}${windowText}`;'
          if old not in text:
              raise SystemExit("Expected refresh-status text not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-refresh-label.yml

      - name: Commit change
        run: |
          git config user.name "Awzy9"
          git config user.email "291288073+Awzy9@users.noreply.github.com"
          git add app.js .github/workflows/one-time-refresh-label.yml
          git commit -m "Make literature refresh status explicit"
          git pull --rebase origin main
          git push origin HEAD:main
