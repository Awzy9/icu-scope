name: Build iOS app (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production, development]
        default: preview
      submit:
        description: Submit to App Store Connect / TestFlight (production only)
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build
        run: >
          eas build --platform ios --profile ${{ inputs.profile }}
          --non-interactive --no-wait
          ${{ inputs.submit && inputs.profile == 'production' && '--auto-submit' || '' }}
