name: iOS app checks

on:
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
      - name: Expo project health
        run: npx expo-doctor
