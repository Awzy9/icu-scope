name: Update ICU literature feed

on:
  schedule:
    - cron: "0 3 * * *" # 06:00 AST (KSA, UTC+3) daily
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/update.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: icu-literature-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync latest main before refresh
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest articles (retry transient failures)
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          RELDATE_DAYS: "120"
          MAX_PER_CATEGORY: "8"
          TRENDING_DAYS: "30"
          TRENDING_CANDIDATES: "60"
          TRENDING_TOP_N: "10"
          FOAMED_DAYS: "30"
          FOAMED_MAX_PER_SOURCE: "6"
          FOAMED_TOTAL_MAX: "15"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "llama-3.1-8b-instant"
          AI_SUMMARY_MAX_PER_RUN: "40"
          GUIDELINE_DAYS: "180"
          GUIDELINE_MAX: "10"
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          EMBEDDING_MAX_PER_RUN: "60"
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          EVIDENCE_ISSUE_FILE: ${{ runner.temp }}/evidence-alert.md
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Literature refresh attempt $attempt/3"
            rc=0
            python scripts/fetch_articles.py || rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$rc" -eq 3 ]; then
              echo "::error::Clinical-evidence safety gate failed - nothing will be committed; deployed content is unchanged."
              exit 3
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "Literature refresh failed after 3 attempts."
          exit 1

      - name: Validate generated feed
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path("data/articles.json")
          if not p.exists():
              raise SystemExit("data/articles.json was not generated")

          data = json.loads(p.read_text(encoding="utf-8"))
          stamp = data.get("generated_at")
          if not stamp:
              raise SystemExit("generated_at is missing")

          generated = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
          age_hours = (datetime.now(timezone.utc) - generated.astimezone(timezone.utc)).total_seconds() / 3600
          if age_hours > 2:
              raise SystemExit(f"generated_at is unexpectedly old ({age_hours:.1f} hours)")

          categories = data.get("categories")
          if not isinstance(categories, list) or not categories:
              raise SystemExit("categories is empty or invalid")

          article_count = sum(len(c.get("articles", [])) for c in categories if isinstance(c, dict))
          if article_count == 0:
              raise SystemExit("feed contains zero category articles")

          print(f"Validated feed: {article_count} category articles; generated {age_hours:.2f}h ago")
          PY

      - name: Safety tests + publication gate (must pass before anything is committed)
        run: |
          python -m unittest discover -s tests -t . -v 2>&1 | tail -n 15
          node --test tests/review_api.test.js
          python scripts/evidence_cli.py audit-verify
          python scripts/evidence_cli.py check

      - name: Notify administrators of retractions / corrections / source changes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="${{ runner.temp }}/evidence-alert.md"
          if [ -s "$f" ]; then
            gh issue create --title "ICU Scope evidence alert $(date -u +%F)" --body-file "$f" --label evidence-alert \
              || gh issue create --title "ICU Scope evidence alert $(date -u +%F)" --body-file "$f"
          else
            echo "No new evidence alerts."
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "Awzy9"
          git config user.email "291288073+Awzy9@users.noreply.github.com"
          FILES="data/articles.json data/ai_cache.json data/spotlight.json data/archive.json data/embeddings.json data/link_check.json feed.xml data/verification.json data/audit_log.jsonl data/evidence_alerts.json data/evidence_run.json"
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard -- $FILES)" ]; then
            echo "No changes to commit."
          else
            git add $FILES
            git commit -m "Update ICU literature feed"
            git push origin "HEAD:main"
          fi
