name: Update ICU literature feed

on:
  schedule:
    - cron: "0 3 * * *" # 06:00 AST (KSA, UTC+3) daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest articles
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          RELDATE_DAYS: "120"
          MAX_PER_CATEGORY: "8"
          TRENDING_DAYS: "30"
          TRENDING_CANDIDATES: "60"
          TRENDING_TOP_N: "10"
          FOAMED_DAYS: "30"
          FOAMED_MAX_PER_SOURCE: "6"
          FOAMED_TOTAL_MAX: "15"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "llama-3.1-8b-instant"
          AI_SUMMARY_MAX_PER_RUN: "40"
          GUIDELINE_DAYS: "180"
          GUIDELINE_MAX: "10"
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          EMBEDDING_MAX_PER_RUN: "60"
        run: python scripts/fetch_articles.py

      - name: Commit and push if changed
        run: |
          git config user.name "icu-scope-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/articles.json data/ai_cache.json data/spotlight.json data/archive.json data/embeddings.json data/link_check.json feed.xml; then
            echo "No changes to commit."
          else
            git add data/articles.json data/ai_cache.json data/spotlight.json data/archive.json data/embeddings.json data/link_check.json feed.xml
            git commit -m "Update ICU literature feed"
            git push
          fi
