name: Update ICU literature feed

on:
  schedule:
    - cron: "17 5 * * *" # ~05:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest articles
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          RELDATE_DAYS: "60"
          MAX_PER_CATEGORY: "8"
          TRENDING_DAYS: "30"
          TRENDING_CANDIDATES: "60"
          TRENDING_TOP_N: "10"
          FOAMED_DAYS: "30"
          FOAMED_MAX_PER_SOURCE: "6"
          FOAMED_TOTAL_MAX: "15"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "llama-3.3-70b-versatile"
          AI_SUMMARY_MAX_PER_RUN: "40"
        run: python scripts/fetch_articles.py

      - name: Commit and push if changed
        run: |
          git config user.name "icu-scope-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/articles.json data/ai_cache.json; then
            echo "No changes to commit."
          else
            git add data/articles.json data/ai_cache.json
            git commit -m "Update ICU literature feed"
            git push
          fi
